<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="A responsive music player built with HTML5, CSS3 and Vanila JavaScript" />
  <meta name="author" content="adil12hassan" />
  <title>Music Player | CodeAlpha</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
</head>

<body>
  <!-- APPLICATION= -->
  <main id="app">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-brand">
        <span class="brand-icon">🎵</span>
        <span class="brand-name">Music Player</span>
      </div>
      <div class="navbar-status">
        <span class="status-dot"></span>
        <span>Now Playing</span>
      </div>
    </nav>
    <!-- MUSIC PLAYER -->
    <section class="music-player" aria-label="Music Player">
      <!-- Player Header -->
      <header class="player-header">
        <div class="player-brand">
          <span class="player-logo">♪</span>

          <div>
            <h1>Music Player</h1>
            <p>Your music, your way.</p>
          </div>
        </div>
      </header>

      <!-- NOW PLAYING -->
      <section class="now-playing" aria-label="Now Playing">
        <!-- Album Artwork -->
        <div class="album-art">
          <img id="album-cover" src="assets/images/covers/cover1.jpg" alt="Current song album cover" />
        </div>

        <!-- Song Information -->
        <div class="song-info">
          <h2 id="song-title">No Song Selected</h2>
          <p id="song-artist">Unknown Artist</p>
        </div>
      </section>

      <!-- PLAYER PROGRESS -->
      <section class="player-progress" aria-label="Song Progress">
        <div class="progress-time">
          <span id="current-time">0:00</span>
          <span id="total-duration">0:00</span>
        </div>
        <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1" aria-label="Song progress" />
      </section>

      <!-- PLAYER CONTROLS -->
      <section class="player-controls" aria-label="Playback Controls">
        <button type="button" id="previous-btn" aria-label="Previous song"> Previous </button>
        <button type="button" id="play-btn" aria-label="Play">Play</button>
        <button type="button" id="next-btn" aria-label="Next song"> Next </button>
      </section>
      <!-- VOLUME -->
      <section class="volume-control" aria-label="Volume Control">
        <label for="volume-bar"> Volume </label>
        <input type="range" id="volume-bar" min="0" max="1" value="1" step="0.01" aria-label="Volume" />
      </section>

      <!-- PLAYLIST -->
      <section class="playlist-section" aria-label="Playlist">
        <div class="playlist-header">
          <h2>Playlist</h2>
          <span id="playlist-count"> 0 Songs </span>
        </div>
        <form id="add-song-form" class="add-song-form">
          <div class="form-row">
            <label class="file-picker" for="audio-file">
              <span>Choose audio</span>
              <input id="audio-file" type="file" required />
            </label>
            <input id="song-title-input" type="text" placeholder="Song title" aria-label="Song title" />
            <input id="song-artist-input" type="text" placeholder="Artist" aria-label="Artist" />
          </div>
          <div class="form-row">
            <label class="file-picker" for="cover-file">
              <span>Choose cover</span>
              <input id="cover-file" type="file" accept="image/*" />
            </label>
            <input id="cover-url-input" type="url" placeholder="Or paste cover image URL"
              aria-label="Cover image URL" />
            <button type="submit" class="add-song-btn">Add song</button>
          </div>
        </form>
        <div class="playlist-tools">
          <label class="search-field" for="playlist-search">
            <span class="sr-only">Search playlist</span>
            <input id="playlist-search" type="search" placeholder="Search songs or artists" />
          </label>
          <label class="sort-field" for="playlist-sort">
            <span class="sr-only">Sort playlist</span>
            <select id="playlist-sort">
              <option value="added">Recently added</option>
              <option value="title-asc">Title A-Z</option>
              <option value="title-desc">Title Z-A</option>
              <option value="artist-asc">Artist A-Z</option>
              <option value="artist-desc">Artist Z-A</option>
            </select>
          </label>
        </div>
        <div id="playlist" class="playlist" aria-live="polite">
          <!-- Songs will be generated by JavaScript -->
        </div>
      </section>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <p>&copy; 2026 Music Player</p>
      <p>Built with HTML5, CSS & JavaScript</p>
      <span>Create by <a class="link" href="https://code-with-hassan-phi.vercel.app">adil12hassan</a></span>
    </div>
  </footer>

  <!-- AUDIO -->
  <audio id="audio-player" preload="metadata"></audio>
  <!-- JAVASCRIPT -->
  <script type="module" src="JS/script.js"></script>
</body>

</html>
