<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Designed Search Bar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      background: linear-gradient(135deg, #ffffff 0%, crimson 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "inconsolata", monospace;
    }

    .container {
      position: relative;
      width: 300px;
      height: 100px;
    }

    .container .search {
      position: absolute;
      margin: auto;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 80px;
      height: 80px;
      background: crimson;
      border-radius: 50%;
      transition: all 1s;
      z-index: 4;
      box-shadow: 0 0 25px 0 rgba(0, 0, 0, 0.4);
    }

    .container .search:hover {
      cursor: pointer;
      transform: scale(1.1);
    }

    .container .search:before {
      content: "";
      position: absolute;
      margin: auto;
      top: 22px;
      right: 0;
      bottom: 0;
      left: 22px;
      width: 12px;
      height: 2px;
      background: white;
      transform: rotate(45deg);
      transition: all 0.5s;
    }

    .container .search:after {
      content: "";
      position: absolute;
      margin: auto;
      top: -5px;
      right: 0;
      bottom: 0;
      left: -5px;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      border: 2px solid white;
      transition: all 0.5s;
    }

    .container input {
      font-family: "inconsolata", monospace;
      position: absolute;
      margin: auto;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 50px;
      height: 50px;
      background: crimson;
      color: white;
      text-shadow: 0 0 10px crimson;
      padding: 0 80px 0 20px;
      border-radius: 30px;
      border: none;
      box-shadow: 0 0 25px 0 crimson, 0 20px 0 rgba(0, 0, 0, 0.2);
      transition: all 1s;
      opacity: 0;
      z-index: 5;
      font-weight: bolder;
      letter-spacing: 0.1em;
      outline: none;
    }

    .container input:hover {
      cursor: pointer;
    }

    .container input:focus {
      width: 300px;
      opacity: 1;
      cursor: text;
    }

    .container input:focus~.search {
      right: -250px;
      background: #151515;
      z-index: 6;
    }

    .container input:focus~.search:before {
      top: 0;
      left: 0;
      width: 25px;
    }

    .container input:focus~.search:after {
      top: 0;
      left: 0;
      width: 25px;
      height: 25px;
      border: none;
      background: white;
      border-radius: 0%;
      transform: rotate(-45deg);
    }

    .container input::placeholder {
      color: white;
      opacity: 0.5;
      font-weight: bolder;
    }

    /* Mobile optimizations */
    @media (max-width: 768px) {
      body {
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 300px;
      }

      .container input:focus {
        width: 100%;
        max-width: 300px;
      }

      .container .search {
        width: 70px;
        height: 70px;
      }

      .container input {
        height: 50px;
        font-size: 16px;
        /* Prevents zoom on iOS */
      }
    }
  </style>
</head>

<body>
  <form action="https://www.google.com/search" method="GET" class="container">
    <input type="text" name="q" placeholder="Search..." autocomplete="off">
    <div class="search"></div>
  </form>
</body>

</html>
